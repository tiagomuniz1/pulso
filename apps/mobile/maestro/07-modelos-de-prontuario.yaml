appId: center.pulso.app
name: Construir um modelo de prontuário
env:
  # Entra como ADMIN: criar e editar modelo é gestão dele. O profissional
  # chega à mesma listagem, mas só para consultar.
  EMAIL: ${MAESTRO_ADMIN_EMAIL}
  PASSWORD: ${MAESTRO_ADMIN_PASSWORD}
  CLINIC: ${MAESTRO_CLINIC}
  RUN_ID: ${MAESTRO_RUN_ID}
---
- runFlow: shared/login.yaml

- tapOn:
    id: "header-menu"
- tapOn:
    id: "drawer-item-medical-record-templates"
- extendedWaitUntil:
    visible:
      id: "template-list-screen"
    timeout: 15000
- assertVisible:
    id: "template-list-header"
- assertVisible:
    id: "template-list-scope"

# Abrir um modelo existente prova que o escopo e os campos voltam do
# servidor — é o caminho que o profissional percorre.
- tapOn:
    id: "template-view-.*"
- extendedWaitUntil:
    visible:
      id: "template-details-name"
    timeout: 15000
- assertVisible:
    id: "template-details-profession"
- assertVisible:
    id: "template-details-specialty"
- tapOn:
    id: "template-details-back"

# Montar um modelo do zero: um campo geral, uma seção com campo dentro.
- tapOn:
    id: "template-list-new"
- extendedWaitUntil:
    visible:
      id: "template-form-name"
    timeout: 10000
- tapOn:
    id: "template-form-name"
- inputText: "Modelo do Maestro ${RUN_ID}"
- hideKeyboard

- tapOn:
    id: "template-form-add-field"
- tapOn:
    id: "field-editor-0-label"
- inputText: "Queixa principal"
- hideKeyboard

# O construtor é uma tela longa, e cresce a cada campo adicionado: "Seções"
# fica abaixo da dobra assim que existe um campo. Tocar sem rolar reporta
# "elemento não encontrado" num botão que está lá — só que fora da tela.
- scrollUntilVisible:
    element:
      id: "template-form-add-section"
    direction: DOWN
- tapOn:
    id: "template-form-add-section"
- scrollUntilVisible:
    element:
      id: "section-editor-title-0"
    direction: DOWN
- tapOn:
    id: "section-editor-title-0"
- inputText: "Exame físico"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "section-editor-add-field-0"
    direction: DOWN
- tapOn:
    id: "section-editor-add-field-0"
- scrollUntilVisible:
    element:
      id: "section-field-editor-0-0-label"
    direction: DOWN
- tapOn:
    id: "section-field-editor-0-0-label"
- inputText: "Ausculta"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "template-form-submit"
    direction: DOWN
- tapOn:
    id: "template-form-submit"

# Criar leva direto ao modelo criado — e é lá que se confere que a seção
# sobreviveu à ida ao servidor.
- extendedWaitUntil:
    visible:
      id: "template-details-name"
    timeout: 20000
- assertVisible:
    id: "template-details-field-0"
- assertVisible:
    id: "template-details-section-title-0"

# E editar abre preenchido: é onde um `null` vindo do servidor trava o campo.
- tapOn:
    id: "template-details-edit"
- extendedWaitUntil:
    visible:
      id: "field-editor-0-label"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "section-editor-title-0"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "template-form-cancel"
    direction: DOWN
- tapOn:
    id: "template-form-cancel"
