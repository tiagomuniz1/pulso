appId: center.pulso.app
---
- launchApp:
    clearState: true
- tapOn:
    id: "login-slug"
- inputText: ${CLINIC}
- tapOn:
    id: "login-email"
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
# Sem isto o teclado cobre o botão e o toque cai nele — o `tapOn` reporta
# sucesso, o login nunca acontece, e a falha aparece três passos depois.
- hideKeyboard
- tapOn:
    id: "login-submit"
# Espera estendida: o primeiro login faz a ida ao servidor, lê o Keychain e
# ainda busca o tema da clínica antes de a agenda montar.
- extendedWaitUntil:
    visible:
      id: "agenda-screen"
    timeout: 20000
