appId: center.pulso.app
name: Login e sessão
env:
  EMAIL: ${MAESTRO_EMAIL}
  PASSWORD: ${MAESTRO_PASSWORD}
  CLINIC: ${MAESTRO_CLINIC}
---
- launchApp:
    clearState: true

- assertVisible:
    id: "login-slug"

- tapOn:
    id: "login-slug"
- inputText: ${CLINIC}

- tapOn:
    id: "login-email"
- inputText: ${EMAIL}

- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}

# Sem isto o teclado cobre o botão e o toque cai nele — o `tapOn` reporta
# sucesso, o login nunca acontece, e a falha aparece no passo seguinte.
- hideKeyboard
- tapOn:
    id: "login-submit"

# A agenda é a tela inicial: é a pergunta que se faz ao desbloquear o celular.
# Espera estendida porque o primeiro login vai ao servidor e ainda busca o
# tema da clínica antes de a agenda montar.
- extendedWaitUntil:
    visible:
      id: "agenda-screen"
    timeout: 20000
- assertVisible:
    id: "toolbar-date-label"

# A sessão sobrevive ao fechamento do app — está no Keychain, não em memória.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "agenda-screen"
    timeout: 20000

# Sair é o avatar do cabeçalho: na web o menu tem "Meu perfil" e "Sair", e
# aqui só o segundo existe porque a tela de perfil ainda não foi portada.
- tapOn:
    id: "header-user"
# Sair revoga o refresh token no servidor antes de limpar a sessão local, e
# só então a navegação reage.
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 20000
